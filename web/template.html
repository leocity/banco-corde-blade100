<title>Banco Corde Blade 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/*__CSS__*/
</style>

<div class="wrap">
  <header class="top">
    <h1>Banco Corde <span>Blade 100</span></h1>
    <span class="sync" id="sync-badge" role="status"></span>
  </header>

  <main>
    <section id="oggi" class="panel" role="tabpanel" aria-labelledby="tab-oggi"></section>

    <section id="prossima" class="panel" role="tabpanel" aria-labelledby="tab-prossima" hidden>
      <div id="next-q"></div>
      <div id="next-list"></div>
      <section class="block">
        <div class="section-head"><h2>Cerca una corda</h2></div>
        <label class="search"><span class="sr">Cerca una corda</span><input type="search" id="next-search" placeholder="Nome, es. O-Toro" autocomplete="off"></label>
        <ul class="results" id="next-results" aria-live="polite"></ul>
      </section>
      <details class="block hy" id="hy-box">
        <summary><h2>Ibridi</h2><span class="muted small">verticali e orizzontali diverse</span></summary>
        <div id="hybrid"></div>
      </details>
      <div id="ask-main"></div>
    </section>

    <section id="mappa" class="panel" role="tabpanel" aria-labelledby="tab-mappa" hidden></section>
  </main>
</div>

<nav class="tabs" role="tablist" aria-label="Sezioni">
  <button role="tab" id="tab-oggi" data-tab="oggi" aria-controls="oggi" aria-selected="true"><span class="ico" aria-hidden="true">◴</span>Oggi</button>
  <button role="tab" id="tab-prossima" data-tab="prossima" aria-controls="prossima" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">→</span>Prossima</button>
  <button role="tab" id="tab-mappa" data-tab="mappa" aria-controls="mappa" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">⇹</span>Mappa</button>
</nav>

<div class="toast" id="toast" role="status" hidden></div>

<div class="tipbox" id="tip" role="dialog" aria-modal="false" aria-labelledby="tip-body" hidden>
  <div id="tip-body"></div>
  <button type="button" class="btn" id="tip-close">Chiudi</button>
</div>

<dialog id="pick-dialog" aria-labelledby="pk-title">
  <div class="dlg">
    <div class="dlg-body">
      <h2 id="pk-title">Cambia corda</h2>
      <label class="search"><span class="sr">Cerca</span><input type="search" id="pk-q" placeholder="Cerca per nome" autocomplete="off"></label>
      <ul class="picklist" id="pk-list"></ul>
      <div id="pk-stock">
        <p class="small">Che cosa hai?</p>
        <div class="chips" role="group" aria-label="Intera o mezza"><button type="button" class="chipbtn" data-size="intera" aria-pressed="true">Intera (un set)</button><button type="button" class="chipbtn" data-size="mezza" aria-pressed="false">Mezza (per ibrido)</button></div>
      </div>
      <div id="pk-kg">
        <div class="row">
          <label>Verticali (kg) <input id="pk-kgv" inputmode="decimal" size="5"></label>
          <label>Orizzontali (kg) <input id="pk-kgh" inputmode="decimal" size="5"></label>
        </div>
        <p class="small muted" id="pk-kg-note">Precompilate con la tensione della corda che togli.</p>
      </div>
      <div id="pk-past">
        <div class="row">
          <label>Dal <input type="date" id="pk-from"></label>
          <label>Al <input type="date" id="pk-to"></label>
        </div>
        <div class="row">
          <label>Ore giocate <input id="pk-hours" inputmode="decimal" size="5"></label>
          <label>Com'è finita <select id="pk-past-reason"><option>consumata</option><option>rotta</option><option>cambiata per prova</option></select></label>
        </div>
        <p class="small muted">Date e ore anche approssimate.</p>
      </div>
      <div id="pk-change">
        <label>Montata il <input type="date" id="pk-date"></label>
        <label id="pk-from-stock" hidden>La prendi da quelle in casa? <select id="pk-from-stock-sel"></select></label>
        <label>La <span id="pk-old"></span> che togli è <select id="pk-reason"><option>consumata</option><option>rotta</option><option>cambiata per prova</option></select></label>
        <p class="small">La ricompreresti?</p>
        <div class="chips" role="group" aria-label="La ricompreresti?"><button type="button" class="chipbtn" data-verdict="si" aria-pressed="false">Sì (va tra le preferite)</button><button type="button" class="chipbtn" data-verdict="forse" aria-pressed="false">Forse</button><button type="button" class="chipbtn" data-verdict="no" aria-pressed="false">No (non mi piace)</button></div>
      </div>
    </div>
    <div class="dlg-foot">
      <p class="err" id="pk-err" role="alert" hidden></p>
      <div class="actions"><button type="button" class="btn" id="pk-cancel">Annulla</button><button type="button" class="btn primary" id="pk-ok">Monta</button></div>
    </div>
  </div>
</dialog>

<dialog id="cmp-dialog" aria-labelledby="cmp-title">
  <div class="dlg">
    <div class="dlg-body">
      <button type="button" class="btn back" id="cmp-close">‹ Indietro</button>
      <h2 id="cmp-title">Confronto</h2>
      <div id="cmp-body"></div>
    </div>
    <div class="dlg-foot"><div class="actions"><button type="button" class="btn" id="cmp-open" data-open="">Apri la scheda</button></div></div>
  </div>
</dialog>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="dlg">
    <div class="dlg-body">
      <button type="button" class="btn back" id="sheet-close">‹ Indietro</button>
      <div id="sheet-body"></div>
    </div>
  </div>
</dialog>

<script>
window.STRINGS_DATA = /*__DATA__*/;
</script>
<script type="module">
/*__JS__*/
</script>
